name: Build React App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build React App with Secrets and Variables
      run: npm run build
      env:
        # Google Client credentials from GitHub Secrets
        REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        REACT_APP_GOOGLE_CLIENT_SECRET: ${{ secrets.REACT_APP_GOOGLE_CLIENT_SECRET }}
        
        # Portfolio constants from GitHub Variables
        REACT_APP_EXPERIENCES: ${{ vars.REACT_APP_EXPERIENCES }}
        REACT_APP_PROJECTS: ${{ vars.REACT_APP_PROJECTS }}
